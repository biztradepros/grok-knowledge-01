name: vet-inbox
# 접수 검사 v2 (F3): 규칙은 .github/insight-rules.json, 검사 코드는 tools/vet.js
# 이 파일은 .github/workflows/vet-inbox.yml 을 대체한다 (이슈 #F2-move 참고)
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
jobs:
  vet:
    if: startsWith(github.event.issue.title, 'insight:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check card
        uses: actions/github-script@v7
        env:
          TARGET_REPO: ${{ vars.TARGET_REPO }}
        with:
          script: |
            const { loadRules, vetText } = require(`${process.env.GITHUB_WORKSPACE}/tools/vet.js`);
            const rules = loadRules(process.env.GITHUB_WORKSPACE);
            const issue = context.payload.issue;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const names = (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name));
            const has = (n) => names.includes(n);
            if (has("approved")) return;

            const [tOwner, tRepo] = (process.env.TARGET_REPO || `${repo.owner}/${repo.repo}`).split("/");
            const list = await github.rest.repos.getContent({ owner: tOwner, repo: tRepo, path: "rooms" });
            const existingRooms = list.data.filter((d) => d.type === "dir").map((d) => d.name);
            const r = vetText(issue.body || "", rules, { existingRooms });

            const say = (body) => github.rest.issues.createComment({ ...repo, issue_number: issue.number, body });
            const drop = async (n) => { if (has(n)) await github.rest.issues.removeLabel({ ...repo, issue_number: issue.number, name: n }).catch(() => {}); };

            if (r.sensitive.length) {
              await drop("inbox");
              if (!has("blocked")) await github.rest.issues.addLabels({ ...repo, issue_number: issue.number, labels: ["blocked"] });
              await say(`접수하지 않았습니다. 공개하면 안 되는 내용이 보입니다:\n- ${r.sensitive.join("\n- ")}\n\n지우고 이슈를 수정하면 다시 검사합니다.`);
              return;
            }
            if (!r.ok) {
              await drop("inbox");
              await say(`형식이 맞지 않습니다:\n- ${r.errors.join("\n- ")}\n\nCHAT.md 의 insight-room:v1 블록을 확인해 주세요.`);
              return;
            }
            await drop("blocked");
            if (!has("inbox")) {
              await github.rest.issues.addLabels({ ...repo, issue_number: issue.number, labels: ["inbox"] });
              await say("접수했습니다. 승인자가 approved 라벨을 붙이면 자동으로 페이퍼가 됩니다.");
            }
